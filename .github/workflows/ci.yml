name: CI

# Every push and pull request is built, linted and tested: unit tests on Linux and Windows, the
# on-device UI tests on Android emulators (8.0, the oldest supported, and 11 on a short phone, 16 on
# a tablet; 17 is tested locally), a Semgrep scan of the code, an OSV vulnerability audit of the
# app's libraries and build tools, and a security audit of the repository. The signing key never
# reaches GitHub: CI builds are signed with the debug key and are never published.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # the default also asks for the long-removed 'tools' package
      - name: Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, lint
        run: ./gradlew assembleDebug assembleRelease test lintDebug lintRelease
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  test-windows:
    name: Unit tests, Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # the default also asks for the long-removed 'tools' package
      - name: Android SDK packages
        shell: pwsh # on Windows the SDK manager is a .bat, which PowerShell finds and bash does not
        run: sdkmanager.bat --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        shell: pwsh
        run: .\gradlew.bat test

  emulator:
    name: Emulator tests, Android ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Android on a short 16:9 phone (360x640 dp): every card must still fit
          - api: "26"
            name: "8.0"
            gpu: swiftshader_indirect
            profile: Nexus 5
            cores: 2
            channel: stable
          - api: "30"
            name: "11"
            gpu: swiftshader_indirect
            profile: Nexus 5
            cores: 2
            channel: stable
          # Android 13 and later draw the wood and the mirror with GPU shaders: the emulator's
          # SwiftShader mode crashes on them, its ANGLE mode runs them
          - api: "36"
            name: "16"
            gpu: angle_indirect
            profile: pixel_tablet
            cores: 4
            channel: stable
          # Android 17 is tested on the development machine before each release: its system crashes
          # inside GitHub's emulators (stable and canary alike), the game itself never does
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # the default also asks for the long-removed 'tools' package
      - name: Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app and its tests
        run: ./gradlew assembleRelease assembleReleaseAndroidTest
      - name: On-device UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          cores: ${{ matrix.cores }}
          channel: ${{ matrix.channel }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedReleaseAndroidTest
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reports-${{ matrix.api }}
          path: app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  semgrep:
    name: Semgrep (Kotlin, security audit, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan the app's code
        run: semgrep scan --config=p/kotlin --config=p/security-audit --config=p/secrets --error --metrics=off app/src/main

  dependency-audit:
    name: Dependency audit (OSV, app libraries and build tools)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # the default also asks for the long-removed 'tools' package
      - name: Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Record every library, shipped and build tools
        run: ./gradlew --no-configuration-cache :app:dependencies --write-locks -PlockDeps -q
      - name: Scan them for known vulnerabilities
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest scan source --lockfile=gradle.lockfile:/src/app/gradle.lockfile

  security:
    name: Security audit (wrapper, secrets, manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gradle wrapper is the genuine one
        uses: gradle/actions/wrapper-validation@v4
      - name: No signing keys or passwords committed
        run: |
          set -e
          bad=$(git log --all --name-only --pretty=format: | grep -E '\.(jks|keystore|p12|pem|key)$|(^|/)keystore\.properties$|(^|/)local\.properties$' || true)
          if [ -n "$bad" ]; then echo "Secret files in history:"; echo "$bad"; exit 1; fi
          if git grep -nIiE '(storePassword|keyPassword)\s*=\s*"[^"]+"' -- ':!*.md'; then echo "A password is written in the code"; exit 1; fi
          echo "No keys or passwords found."
      - name: The app does not allow backups and asks for no extra permissions
        run: |
          set -e
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          if grep -q '<uses-permission' app/src/main/AndroidManifest.xml; then grep '<uses-permission' app/src/main/AndroidManifest.xml; fi
          echo "Manifest checked."
